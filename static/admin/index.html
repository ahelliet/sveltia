<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Sveltia CMS</title>
    <!-- Empêche l'initialisation automatique de la CMS : on la déclenche
         nous-mêmes depuis preview.js, une fois le nom du site récupéré
         (site-meta.json), pour personnaliser le titre affiché à côté du
         logo (app_title) — voir le README, section "Titre de l'admin". -->
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
  </head>
  <body>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@18.0.11/lib/marked.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/embla-carousel@8.6.0/embla-carousel.umd.js"></script>
    <script src="preview.js"></script>
  </body>
</html>
