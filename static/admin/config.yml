# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: ahelliet/sveltia
  branch: main
  # Pour l'auth OAuth via un petit worker Cloudflare (recommandé à plusieurs
  # éditeurs) plutôt que le "Sign In with Token" par défaut, décommente et
  # renseigne l'URL une fois le worker déployé (voir README) :
  # base_url: https://ton-worker.workers.dev

# Workflow éditorial : chaque nouvelle entrée / modification part sur sa
# propre branche ("cms/<collection>/<slug>") avec une pull request GitHub
# associée, au lieu de partir directement sur "main" à chaque sauvegarde.
# Une entrée passe par 3 statuts (Brouillon -> En révision -> Prêt à
# publier), affichés comme des colonnes dans l'admin (bouton "Workflow" en
# haut) ; "Publier" fusionne la pull request, "Supprimer" la ferme. Permet
# de préparer/relire un contenu avant qu'il soit vraiment en ligne, et à
# plusieurs éditeurs de se relire mutuellement avant publication. Nécessite
# le backend GitHub (déjà le cas ici) — voir
# https://sveltiacms.app/en/docs/workflows/editorial
publish_mode: editorial_workflow

# Interface d'administration en français (éditeurs francophones) plutôt que
# l'anglais par défaut.
locale: "fr"

# Décommente une fois le site déployé (même URL que "Paramètres globaux →
# Référencement → URL du site") : ajoute un lien "Voir le site" dans l'admin.
# site_url: https://mon-site.fr
# Logo personnalisé affiché dans l'en-tête de l'admin (remplace l'icône par
# défaut de Sveltia CMS), visible dès le chargement du CMS. Pour l'instant on
# réutilise l'icône du site (static/images/logo.svg) — remplace ce fichier
# par ton propre logo quand tu en as un. (`logo:` plutôt que l'ancien
# `logo_url`, déprécié au profit de cette syntaxe.)
logo:
  src: /images/logo.svg
  show_in_header: true

# Le titre affiché à côté de ce logo ("Sveltia CMS" par défaut) est défini
# dynamiquement au chargement, à partir du nom du site dans Paramètres
# globaux — voir static/admin/preview.js et le README, section "Titre de
# l'admin". Pas besoin d'app_title ici : le laisser non défini permet à
# preview.js de le fournir (ou pas) selon les données.

# Évite les accents/caractères spéciaux dans les slugs générés depuis des
# titres en français (ex : "Bilan à mi-année" -> "bilan-a-mi-annee" plutôt
# que des caractères encodés ou non-ASCII dans l'URL).
slug:
  encoding: "ascii"
  clean_accents: true

media_folder: "static/images/uploads"
public_folder: "/images/uploads"

# Fichiers uploadés (images) : noms normalisés (mêmes règles que les slugs
# d'articles/pages ci-dessus — plus d'accents/espaces dans les URLs
# d'images) et taille plafonnée à 5 Mo. Ce site n'a pas de pipeline
# d'optimisation d'image côté CMS (les images restent telles quelles dans
# static/), d'où l'intérêt d'éviter qu'un gros fichier non compressé finisse
# publié tel quel.
media_library:
  name: default
  config:
    slugify_filename: true
    max_file_size: 5242880 # 5 Mo

collections:
  - name: "posts"
    label: "Articles"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: ["title", "date"]
    # Uploads depuis cette collection rangés dans leur propre sous-dossier
    # plutôt que mélangés avec ceux des pages/paramètres globaux.
    media_folder: "{{media_folder}}/posts"
    public_folder: "{{public_folder}}/posts"
    # Lien "Voir en ligne" dans l'admin, vers l'URL réelle de l'article
    # (src/routes/blog/[slug]/+page.svelte). Fonctionne même sans "URL du
    # site" renseignée : Sveltia CMS retombe sur l'origine courante
    # (localhost en dev, le vrai domaine une fois déployé).
    preview_path: "blog/{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - label: "Date de publication"
        name: "date"
        widget: "datetime"
        default: "{{now}}"
      - label: "Résumé"
        name: "excerpt"
        widget: "text"
        required: false
        pattern:
          [
            "^.{0,200}$",
            "200 caractères maximum — c'est l'accroche affichée dans la liste des articles.",
          ]
      - { label: "Image principale", name: "heroImage", widget: "image", required: false }
      - label: "Texte alternatif de l'image principale"
        name: "heroImageAlt"
        widget: "string"
        required: false
        hint: "Décrit l'image pour les lecteurs d'écran. Si vide, utilise le titre de l'article."
      - label: "Blocs de contenu (page builder)"
        name: "blocks"
        widget: "list"
        required: false
        # &blockTypes : les mêmes blocs sont réutilisés tels quels par la
        # collection "pages" ci-dessous (ancre YAML), pour ne définir ces
        # types qu'une seule fois.
        types: &blockTypes
          - label: "Texte"
            name: "text"
            widget: "object"
            fields:
              - { label: "Contenu", name: "body", widget: "markdown" }
          - label: "Image"
            name: "image"
            widget: "object"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Légende", name: "caption", widget: "string", required: false }
              - { label: "Texte alternatif", name: "alt", widget: "string", required: false }
          - label: "Image + Texte"
            name: "image_text"
            widget: "object"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Texte alternatif", name: "alt", widget: "string", required: false }
              - { label: "Texte", name: "body", widget: "markdown" }
              - { label: "Image à droite", name: "imageOnRight", widget: "boolean", default: false }
          - label: "Citation"
            name: "quote"
            widget: "object"
            fields:
              - { label: "Citation", name: "quote", widget: "text" }
              - { label: "Auteur", name: "author", widget: "string", required: false }
          - label: "Galerie"
            name: "gallery"
            widget: "object"
            fields:
              - label: "Images"
                name: "images"
                widget: "list"
                fields:
                  - { label: "Image", name: "image", widget: "image" }
                  - { label: "Texte alternatif", name: "alt", widget: "string", required: false }
          - label: "Documents téléchargeables"
            name: "documents"
            widget: "object"
            fields:
              - label: "Documents"
                name: "documents"
                widget: "list"
                summary: "{{fields.label}}"
                fields:
                  - { label: "Titre du document", name: "label", widget: "string" }
                  - label: "Fichier (PDF)"
                    name: "file"
                    widget: "file"
                    # Limite le sélecteur de fichiers aux PDF (règlement,
                    # statuts, bulletin d'adhésion, certificat médical...) —
                    # le widget "file" accepte n'importe quel type de
                    # fichier par défaut, contrairement au widget "image".
                    accept: "application/pdf"
                  - label: "Description (optionnel)"
                    name: "description"
                    widget: "string"
                    required: false
      - label: "Référencement (SEO)"
        name: "seo"
        widget: "object"
        required: false
        collapsed: true
        # &seoFields : mêmes champs réutilisés par la collection "pages"
        # (ancre YAML), pour ne les définir qu'une seule fois.
        fields: &seoFields
          - label: "Titre meta (SEO)"
            name: "metaTitle"
            widget: "string"
            required: false
            pattern: ["^.{0,60}$", "60 caractères maximum (au-delà, Google tronque le titre)."]
            hint: "Si vide, utilise le titre ci-dessus."
          - label: "Description meta (SEO)"
            name: "metaDescription"
            widget: "text"
            required: false
            pattern: ["^.{0,155}$", "155 caractères maximum (au-delà, Google tronque la description)."]
            hint: "Si vide, utilise la description par défaut des paramètres globaux."
          - label: "Image de partage (Open Graph)"
            name: "ogImage"
            widget: "image"
            required: false
            hint: "Si vide, utilise l'image principale, sinon l'image par défaut des paramètres globaux."
          - label: "Ne pas indexer (noindex)"
            name: "noIndex"
            widget: "boolean"
            default: false
            required: false

  - name: "pages"
    label: "Pages"
    folder: "content/pages"
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields: ["title"]
    media_folder: "{{media_folder}}/pages"
    public_folder: "{{public_folder}}/pages"
    # Même principe que "posts" ci-dessus (src/routes/[slug]/+page.svelte).
    # La page d'accueil ("/") est un singleton séparé (voir "home"
    # ci-dessous), pas une entrée de cette collection.
    preview_path: "{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - label: "Blocs de contenu (page builder)"
        name: "blocks"
        widget: "list"
        required: false
        types: *blockTypes
      - label: "Référencement (SEO)"
        name: "seo"
        widget: "object"
        required: false
        collapsed: true
        fields: *seoFields

# "Page d'accueil", "Navigation" et "Paramètres globaux" en singletons
# plutôt qu'en collections : un clic dans le menu de gauche ouvre
# directement le formulaire (+ aperçu), sans passer par un écran
# intermédiaire à choisir parmi une liste d'un seul élément. Voir
# https://sveltiacms.app/en/docs/collections/singletons
singletons:
  - name: "home"
    label: "Page d'accueil"
    file: "content/home.md"
    # "/" plutôt qu'un chemin construit à partir d'un champ — la page
    # d'accueil n'a pas de slug, contrairement à "posts"/"pages".
    preview_path: ""
    fields:
      - label: "Blocs de contenu (page builder)"
        name: "blocks"
        widget: "list"
        required: false
        types: *blockTypes
      - label: "Référencement (SEO)"
        name: "seo"
        widget: "object"
        required: false
        collapsed: true
        # Pas de champ "titre" ici (contrairement à "posts"/"pages") : la
        # page d'accueil n'affiche pas de titre visible (voir
        # PageContent.svelte / le README), donc metaTitle sert aussi de
        # secours pour le <title> — sans lui, c'est le nom du site qui est
        # utilisé (voir src/routes/+page.svelte).
        fields: *seoFields

  - name: "navigation"
    label: "Navigation"
    file: "content/navigation.json"
    fields:
      - label: "Liens du menu"
        name: "navLinks"
        widget: "list"
        # Chaque lien du menu choisit UN type ci-dessous et n'affiche que
        # les champs utiles à ce type-là — plus clair qu'un champ "type de
        # lien" suivi de plusieurs champs optionnels tous visibles en même
        # temps, quel que soit le type choisi. Les 4 types "simples" (Page /
        # Article / Ancre / URL) sont ancrés individuellement (au lieu d'une
        # seule liste &navLinkTypes) car une liste YAML ne peut pas
        # s'auto-référencer : le type "dropdown" ci-dessous a besoin de les
        # référencer pour son propre sous-menu, tout comme "Liens du pied de
        # page" plus bas.
        types:
          - &navLinkTypePage
            label: "Page du site"
            name: "page"
            widget: "object"
            summary: "{{fields.label}} → page : {{fields.page}}"
            fields:
              - { label: "Libellé", name: "label", widget: "string" }
              - label: "Page liée"
                name: "page"
                widget: "relation"
                collection: "pages"
                search_fields: ["title"]
                value_field: "{{slug}}"
                display_fields: ["title"]
                # Toujours un menu déroulant avec recherche plutôt que des
                # boutons radio (le rendu par défaut de Sveltia CMS tant
                # qu'il y a peu d'entrées — moins de "dropdown_threshold",
                # 5 par défaut — d'où l'aspect "case à cocher" avec 1 ou 2
                # pages seulement).
                dropdown_threshold: 0
              - label: "Ancre (optionnel)"
                name: "anchor"
                widget: "string"
                required: false
                hint: >-
                  Fait défiler jusqu'à l'élément portant cet identifiant sur
                  la page, sans le # (ex : contact).
          - &navLinkTypePost
            label: "Article de blog"
            name: "post"
            widget: "object"
            summary: "{{fields.label}} → article : {{fields.post}}"
            fields:
              - { label: "Libellé", name: "label", widget: "string" }
              - label: "Article lié"
                name: "post"
                widget: "relation"
                collection: "posts"
                search_fields: ["title"]
                value_field: "{{slug}}"
                display_fields: ["title"]
                # Même raison que "Page liée" ci-dessus.
                dropdown_threshold: 0
              - label: "Ancre (optionnel)"
                name: "anchor"
                widget: "string"
                required: false
                hint: "Sans le # (ex : commentaires)."
          - &navLinkTypeAnchor
            label: "Ancre sur cette page"
            name: "anchor"
            widget: "object"
            summary: "{{fields.label}} → #{{fields.anchor}}"
            fields:
              - { label: "Libellé", name: "label", widget: "string" }
              - label: "Ancre"
                name: "anchor"
                widget: "string"
                hint: >-
                  Identifiant de la section vers laquelle défiler, sans le #
                  (ex : contact). Le lien reste sur la page en cours —
                  pratique pour un menu qui pointe vers une section plus bas
                  sur la même page.
          - &navLinkTypeUrl
            label: "URL personnalisée"
            name: "url"
            widget: "object"
            summary: "{{fields.label}} → {{fields.url}}"
            fields:
              - { label: "Libellé", name: "label", widget: "string" }
              - label: "URL"
                name: "url"
                widget: "string"
                hint: "Ex : https://..., /mentions-legales, #ancre..."
          - label: "Sous-menu (dropdown)"
            name: "dropdown"
            widget: "object"
            summary: "{{fields.label}} → sous-menu"
            fields:
              - { label: "Libellé", name: "label", widget: "string" }
              - label: "Liens du sous-menu"
                name: "links"
                widget: "list"
                # Un sous-menu ne peut pas contenir un autre sous-menu :
                # seuls les 4 types "simples" sont proposés ici, pas
                # "dropdown" lui-même.
                types:
                  - *navLinkTypePage
                  - *navLinkTypePost
                  - *navLinkTypeAnchor
                  - *navLinkTypeUrl
      - label: "Texte du pied de page"
        name: "footerText"
        widget: "string"
        required: false
      - label: "Liens du pied de page"
        name: "footerLinks"
        widget: "list"
        required: false
        # Pas de type "dropdown" en pied de page : reste une liste de liens
        # simples (pas de sous-menu déroulant dans le footer).
        types:
          - *navLinkTypePage
          - *navLinkTypePost
          - *navLinkTypeAnchor
          - *navLinkTypeUrl

  - name: "settings"
    label: "Paramètres globaux"
    editor:
      preview: false # données informatives (nom du site, SEO...), pas de rendu visuel à prévisualiser
    file: "content/settings.json"
    fields:
      - { label: "Nom du site", name: "siteName", widget: "string" }
      - label: "Description du site"
        name: "siteDescription"
        widget: "text"
        required: false
        pattern: ["^.{0,155}$", "155 caractères maximum (au-delà, Google tronque la description)."]
        hint: "Sert aussi de description meta (SEO) par défaut."
      - label: "Favicon"
        name: "favicon"
        widget: "image"
        required: false
        hint: "Icône affichée dans l'onglet du navigateur. SVG, PNG ou ICO. Si vide, garde l'icône par défaut du projet."
      - label: "Image par défaut (partage social)"
        name: "defaultImage"
        widget: "image"
        required: false
        hint: "Utilisée comme image Open Graph / Twitter par défaut quand une page n'en définit pas."
      - label: "Email de contact"
        name: "contactEmail"
        widget: "string"
        required: false
        pattern:
          [
            "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$",
            "Merci de saisir une adresse email valide (ex : contact@mon-site.fr).",
          ]
      - label: "Référencement (SEO & GEO)"
        name: "seo"
        widget: "object"
        required: false
        collapsed: true
        hint: >-
          GEO = Generative Engine Optimization : ce qui aide aussi les
          moteurs de réponse par IA (résumés, citations) à bien comprendre
          et citer le site, en plus du SEO classique.
        fields:
          - label: "URL du site (production)"
            name: "siteUrl"
            widget: "string"
            required: false
            hint: >-
              Ex : https://mon-site.fr — nécessaire pour générer des URLs
              absolues (Open Graph, sitemap, robots.txt, flux RSS).
          - label: "Modèle de titre"
            name: "titleTemplate"
            widget: "string"
            required: false
            default: "%s · %s"
            hint: >-
              %s sera remplacé par le titre de la page puis par le nom du
              site (ex : "Contact · Mon Site").
          - label: "Langue / locale"
            name: "locale"
            widget: "string"
            required: false
            default: "fr_FR"
            hint: "Ex : fr_FR — utilisé pour l'attribut lang et og:locale."
          - label: "Autoriser l'indexation par les moteurs"
            name: "robotsIndexing"
            widget: "boolean"
            default: true
            required: false
            hint: "Désactive globalement l'indexation (robots.txt) — utile en pré-production."
          - label: "Compte X / Twitter (@identifiant)"
            name: "twitterHandle"
            widget: "string"
            required: false
          - label: "Type de carte X / Twitter"
            name: "twitterCardType"
            widget: "select"
            options: ["summary", "summary_large_image"]
            default: "summary_large_image"
            required: false
          - label: "Nom de l'organisation (données structurées)"
            name: "organizationName"
            widget: "string"
            required: false
            hint: "Utilisé pour le schema.org Organization/WebSite (aide le SEO/GEO)."
          - label: "Logo de l'organisation (données structurées)"
            name: "organizationLogo"
            widget: "image"
            required: false
          - label: "Réseaux sociaux (schema.org sameAs)"
            name: "sameAs"
            widget: "list"
            required: false
            hint: "Une URL par ligne (LinkedIn, X, Instagram...)."
          - label: "Code de vérification Google Search Console"
            name: "googleSiteVerification"
            widget: "string"
            required: false
